name: csam_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.2
  font_awesome_flutter: ^10.7.0
  # Charts & Graphs
  fl_chart: ^1.1.0   # nâng từ 0.66.x lên bản mới

  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.4.0

  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Images & Camera
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0
  video_player: ^2.7.0

  # Sensors & IoT
  sensors_plus: ^6.1.2   # nâng từ 4.0.x lên bản mới

  # Utils
  uuid: ^4.2.1

  intl: ^0.20.0
  crypto: ^3.0.6
  # Form & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0   # giữ nguyên (đã khớp intl 0.20.x)

  # firebase
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0       # nâng từ 3.0.x lên bản mới
  hive_generator: ^2.0.1
  build_runner: ^2.4.7         # nâng từ 2.4.7 lên bản mới
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/images/samnghigia.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Uncomment and add asset paths when you have actual assets
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # Uncomment and add font paths when you have actual font files
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700